name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned-debug APK
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 34.0.0 and platform 34
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*') { $v = $ref.Substring(1) } else { $v = '1.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Build APK
        shell: pwsh
        run: |
          ./scripts/build-apk.ps1 -VersionName "${{ steps.ver.outputs.version }}" -OutDir dist

      - name: Show output
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliGrab-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
