name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: ${{ github.workspace }}\.android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}\.android-sdk

jobs:
  build:
    name: Build APK
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 Android SDK 组件，避免每次流水线重复下载约 115 MB
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\.android-sdk
          key: android-sdk-r34-win-${{ runner.os }}-v1

      # 不用 android-actions/setup-android：它默认安装 'tools' 包，
      # 而 Google 已下架该包，会导致 "Failed to find package 'tools'" 失败。
      - name: Install Android SDK components
        shell: pwsh
        run: |
          ./scripts/setup-sdk.ps1 -SdkRoot "$env:ANDROID_HOME"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK 安装失败" }

      - name: Verify toolchain
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME    = $env:JAVA_HOME"
          Write-Host "ANDROID_HOME = $env:ANDROID_HOME"
          java -version
          Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools')
          Get-ChildItem (Join-Path $env:ANDROID_HOME 'platforms')

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -like 'v*') { $v = $ref.Substring(1) } else { $v = '1.0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Build APK
        shell: pwsh
        env:
          # 可选：配置 Secret 后，CI 产物与本地发布产物使用同一把签名密钥，
          # 用户才能在已装版本上原地升级。未配置时会临时生成一把新钥匙，
          # 该产物仅适合测试安装。
          BILIGRAB_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          BILIGRAB_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if (-not $env:BILIGRAB_KEYSTORE_BASE64 -and "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq "true") {
            Write-Host "::warning::未配置 KEYSTORE_BASE64，本次 Release 使用临时密钥签名，已安装用户将无法升级该产物"
          }
          ./scripts/build-apk.ps1 -VersionName "${{ steps.ver.outputs.version }}" -OutDir dist
          if ($LASTEXITCODE -ne 0) { throw "构建失败" }

      - name: Show output
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $apk = Get-ChildItem dist -Filter *.apk | Select-Object -First 1
          "sha256=" + (Get-FileHash $apk.FullName -Algorithm SHA256).Hash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliGrab-${{ steps.ver.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
